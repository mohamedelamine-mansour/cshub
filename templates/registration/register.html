{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<h1>Create an account</h1>
<p class="text-muted">Your account must be approved by the admin before you can log in.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Register</button>
</form>
{% endblock %}
