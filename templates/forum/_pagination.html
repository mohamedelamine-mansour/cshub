{% if page.has_other_pages %}
<nav aria-label="Pages">
    <ul class="pagination justify-content-center">
        {% if page.has_previous %}
        <li class="page-item">
            <a class="page-link"
                href="?{% if querystring %}{{ querystring }}&page={{ page.previous_page_number }}{% else %}page={{ page.previous_page_number }}{% endif %}">Previous</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Previous</span></li>
        {% endif %}

        <li class="page-item disabled">
            <span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
        </li>

        {% if page.has_next %}
        <li class="page-item">
            <a class="page-link"
                href="?{% if querystring %}{{ querystring }}&page={{ page.next_page_number }}{% else %}page={{ page.next_page_number }}{% endif %}">Next</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Next</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
