{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Communities</h1>
<ul class="list-group">
    {% for community in communities %}
    <li class="list-group-item">
        <strong><a href="{% url 'community_detail' community.pk %}">{{ community.name }}</a></strong><br>
        {{ community.description }}
    </li>
    {% empty %}
    <li class="list-group-item">No communities yet.</li>
    {% endfor %}
</ul>
{% endblock %}
