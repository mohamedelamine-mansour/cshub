{% extends 'base.html' %}

{% block title %}Delete post{% endblock %}

{% block content %}
<h1>Delete this post?</h1>
<p dir="auto"><strong>{{ post.title }}</strong></p>
<p class="text-muted">This also deletes its comments and likes, and it cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'post_detail' post.pk %}">Cancel</a>
</form>
{% endblock %}
