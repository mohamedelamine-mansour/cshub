{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<p class="small"><a href="{% url 'community_detail' post.community.pk %}">{{ post.community.name }}</a></p>
<h1 dir="auto">{{ post.title }}</h1>
<p class="text-muted small">
    by {{ post.author.username }} · {{ post.created_at|date:"d M Y H:i" }}
</p>
<div dir="auto">{{ post.body|linebreaks }}</div>
{% endblock %}
