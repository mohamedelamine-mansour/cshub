{% extends 'base.html' %}

{% block title %}Report post{% endblock %}

{% block content %}
<h1 class="h3">Report a post</h1>
<p class="text-muted">You are reporting: <strong dir="auto">{{ post.title }}</strong></p>
<form method="post">
    {% csrf_token %}
    {% include 'forum/_form_fields.html' %}
    <button class="btn btn-danger" type="submit">Send report</button>
    <a class="btn btn-outline-secondary" href="{% url 'post_detail' post.pk %}">Cancel</a>
</form>
{% endblock %}
