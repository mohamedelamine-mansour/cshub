{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit post{% else %}New post{% endif %}{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit post{% else %}New post{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {% include 'forum/_form_fields.html' %}
    <button class="btn btn-primary" type="submit">
        {% if form.instance.pk %}Save changes{% else %}Publish{% endif %}
    </button>
    <a class="btn btn-outline-secondary" href="{% url 'home' %}">Cancel</a>
</form>
{% endblock %}
