{% extends 'base.html' %}

{% block title %}New post{% endblock %}

{% block content %}
<h1>New post</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Publish</button>
    <a class="btn btn-outline-secondary" href="{% url 'home' %}">Cancel</a>
</form>
{% endblock %}
