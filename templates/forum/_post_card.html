<div class="card mb-3">
    <div class="card-body">
        <h2 class="h5 card-title" dir="auto">
            <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
        </h2>
        <p class="text-muted small mb-2">
            <a href="{% url 'community_detail' post.community.pk %}">{{ post.community.name }}</a>
            · by {{ post.author.username }} · {{ post.created_at|date:"d M Y" }}
        </p>
        <p class="mb-2" dir="auto">{{ post.body|truncatewords:25 }}</p>
        <span class="small text-muted">&#9650; {{ post.like_count }} · {{ post.comment_count }} comment{{
            post.comment_count|pluralize }}</span>
    </div>
</div>
