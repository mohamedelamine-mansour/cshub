<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CsHub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Cs<span style="color:#C2410C">Hub</span></a>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
                </form>
                {% else %}
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Log in</a>
                <a class="btn btn-sm" style="background:#C2410C;color:#fff" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
